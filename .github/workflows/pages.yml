name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Build static site
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: |
          rm -rf assets
          rm -f index.html 404.html .nojekyll _shell.html
          npm run build:pages
      - name: Commit the site Pages serves from this branch
        run: |
          cp -a dist/client/. .
          rm -f _shell.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html 404.html .nojekyll favicon.svg og.jpg x-banner.jpg assets __grok
          git diff --staged --quiet && exit 0
          git commit -m "Publish GitHub Pages [skip ci]"
          git push
